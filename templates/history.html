<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>User History</title>

    <!-- Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <h1 class="main-title text-center mb-5">

        Analysis History

    </h1>

    <div class="card dashboard-card">

        <div class="card-body">

            <table class="table table-dark table-striped">

                <thead>

                    <tr>

                        <th>Resume</th>

                        <th>Career</th>

                        <th>Career Match</th>

                        <th>ATS Score</th>

                        <th>Skills</th>

                    </tr>

                </thead>

                <tbody>

                    {% for row in rows %}

                    <tr>

                        <td>{{ row[0] }}</td>

                        <td>{{ row[1] }}</td>

                        <td>{{ row[2] }}%</td>

                        <td>{{ row[3] }}/100</td>

                        <td>{{ row[4] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
